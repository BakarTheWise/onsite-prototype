<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171d19">
    <title>OnSite is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #1c211e; background: #f7f8f6; font: 15px system-ui, sans-serif; }
      main { width: min(100%, 430px); padding: 32px; border: 1px solid #e7eae7; border-radius: 16px; background: #fff; }
      h1 { margin: 20px 0 8px; font-size: 25px; letter-spacing: -.04em; }
      p { color: #788079; font-size: 13px; line-height: 1.65; }
      button { min-height: 42px; margin-top: 12px; padding: 0 16px; border: 0; border-radius: 9px; color: #fff; background: #263d32; font: inherit; font-size: 12px; font-weight: 700; }
      .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: #fff; background: #263d32; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">O</div>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to safely load your workspace. OnSite does not store private project pages on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
